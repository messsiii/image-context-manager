<svg xmlns="http://www.w3.org/2000/svg" width="600" height="840" viewBox="0 0 600 840" role="img" aria-labelledby="title desc">
<title id="title">Your harness owns the final request</title>
<desc id="desc">Host and component responsibilities: the host owns history and trusted results, the component plans a checked request copy, and the host adapts and sends it. Recall is host initiated.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17283b}.heading{font-size:28px;font-weight:700}.label{font-size:26px;font-weight:650}.body{font-size:26px}.step{font-size:23px;font-weight:700;fill:#fff}.arrow{fill:none;stroke:#708397;stroke-width:3}</style>
<rect width="600" height="840" rx="16" fill="#f5f8fb"/>
<text class="heading" x="28" y="48">Your harness owns the final request</text>
<rect x="24" y="80" width="552" height="132" rx="12" fill="#fff" stroke="#cbd6e1"/>
<circle cx="54" cy="114" r="18" fill="#736044"/>
<text class="step" text-anchor="middle" x="54" y="122">1</text>
<text class="label" x="84" y="123">HOST · history and task decisions</text>
<text class="body" x="44" y="159">Keep history; register each attachment.</text>
<text class="body" x="44" y="188">Bind images; commit checked results.</text>
<path class="arrow" d="M300 216 v18 m-6 -6 6 6 6 -6"/>
<rect x="24" y="240" width="552" height="132" rx="12" fill="#fff" stroke="#cbd6e1"/>
<circle cx="54" cy="274" r="18" fill="#315e93"/>
<text class="step" text-anchor="middle" x="54" y="282">2</text>
<text class="label" x="84" y="283">COMPONENT · plan and validate</text>
<text class="body" x="44" y="319">HistoricalImages plans replacements.</text>
<text class="body" x="44" y="348">apply_plan checks and changes a copy.</text>
<path class="arrow" d="M300 376 v18 m-6 -6 6 6 6 -6"/>
<rect x="24" y="400" width="552" height="132" rx="12" fill="#fff" stroke="#cbd6e1"/>
<circle cx="54" cy="434" r="18" fill="#736044"/>
<text class="step" text-anchor="middle" x="54" y="442">3</text>
<text class="label" x="84" y="443">HOST · adapt and send</text>
<text class="body" x="44" y="479">Map copy to provider request format.</text>
<text class="body" x="44" y="508">Check outgoing images; call the model.</text>
<rect x="24" y="560" width="552" height="132" rx="12" fill="#fff" stroke="#cbd6e1"/>
<circle cx="54" cy="594" r="18" fill="#315e93"/>
<text class="step" text-anchor="middle" x="54" y="602">4</text>
<text class="label" x="84" y="603">HOST + STORE · explicit recall</text>
<text class="body" x="44" y="639">AssetStore keeps originals + hashes.</text>
<text class="body" x="44" y="668">Host recalls; registers a new image.</text>
<text class="body" x="28" y="720">No automatic OCR, summary or cropping.</text>
<text class="body" x="28" y="749">No default Codex or tool-image support.</text>
</svg>
