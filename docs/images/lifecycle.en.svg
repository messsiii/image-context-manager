<svg xmlns="http://www.w3.org/2000/svg" width="640" height="840" viewBox="0 0 640 840" role="img" aria-labelledby="title desc">
<title id="title">Keep evidence; reduce repeated images</title>
<desc id="desc">Conceptual lifecycle: the host declares tasks, eligible images become references only in a request copy, protected images remain, and originals can be restored.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17283b}.heading{font-size:28px;font-weight:700}.label{font-size:24px;font-weight:650}.body{font-size:22px}.step{font-size:23px;font-weight:700;fill:#fff}.arrow{fill:none;stroke:#708397;stroke-width:3}</style>
<rect width="640" height="840" rx="16" fill="#f5f8fb"/>
<text class="heading" x="28" y="48">Keep evidence; reduce repeated images</text>
<rect x="24" y="80" width="592" height="132" rx="12" fill="#fff" stroke="#cbd6e1"/>
<circle cx="54" cy="114" r="18" fill="#315e93"/>
<text class="step" text-anchor="middle" x="54" y="122">1</text>
<text class="label" x="84" y="123">Track each attachment</text>
<text class="body" x="44" y="159">Store original bytes outside the request.</text>
<text class="body" x="44" y="188">Record source, version, task and lifecycle.</text>
<path class="arrow" d="M320 216 v18 m-6 -6 6 6 6 -6"/>
<rect x="24" y="240" width="592" height="132" rx="12" fill="#fff" stroke="#cbd6e1"/>
<circle cx="54" cy="274" r="18" fill="#315e93"/>
<text class="step" text-anchor="middle" x="54" y="282">2</text>
<text class="label" x="84" y="283">Retire only eligible history</text>
<text class="body" x="44" y="319">Host checks the result and declares completion.</text>
<text class="body" x="44" y="348">Matching receipt + guards → text reference.</text>
<path class="arrow" d="M320 376 v18 m-6 -6 6 6 6 -6"/>
<rect x="24" y="400" width="592" height="132" rx="12" fill="#fff" stroke="#cbd6e1"/>
<circle cx="54" cy="434" r="18" fill="#736044"/>
<text class="step" text-anchor="middle" x="54" y="442">3</text>
<text class="label" x="84" y="443">Keep protected images in the request</text>
<text class="body" x="44" y="479">Current, pending, uncertain or required evidence;</text>
<text class="body" x="44" y="508">comparison, quality, relation and action tasks.</text>
<path class="arrow" d="M320 536 v18 m-6 -6 6 6 6 -6"/>
<rect x="24" y="560" width="592" height="132" rx="12" fill="#fff" stroke="#cbd6e1"/>
<circle cx="54" cy="594" r="18" fill="#315e93"/>
<text class="step" text-anchor="middle" x="54" y="602">4</text>
<text class="label" x="84" y="603">Restore when pixels are needed</text>
<text class="body" x="44" y="639">Comparison: rebuild from canonical history.</text>
<text class="body" x="44" y="668">Explicit recall: attach a verified original anew.</text>
<text class="body" x="28" y="720">Conceptual flow, not a measured size reduction.</text>
<text class="body" x="28" y="749">Canonical history and stored originals stay intact.</text>
</svg>
