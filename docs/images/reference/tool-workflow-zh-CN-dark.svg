<text x="36" y="170" font-size="11" font-weight="400" fill="#A1A1AA" class="sans" text-anchor="start">agent + 已安装的 skill</text>
<text x="36" y="194" font-size="10" font-weight="400" fill="#A1A1AA" class="sans" text-anchor="start">先读文字，再确定看图用途</text>
<text x="36" y="234" font-size="10" font-weight="400" fill="#FF8A3D" class="mono" text-anchor="start">skill</text>
<path d="M176 158H194" class="wire"/>
<path d="M176 158H194" class="pulse"/>
<rect x="198" y="74" width="150" height="176" rx="10" fill="#1A1A1E" stroke="#26262B"/>
