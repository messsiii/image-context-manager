<text x="210" y="147" font-size="13" font-weight="600" fill="#EDEDEF" class="sans" text-anchor="start">准备要看的图片</text>
<text x="210" y="170" font-size="11" font-weight="400" fill="#A1A1AA" class="sans" text-anchor="start">ICM 本地工具</text>
<text x="210" y="194" font-size="10" font-weight="400" fill="#A1A1AA" class="sans" text-anchor="start">按需保留原图、裁剪或压缩</text>
<text x="210" y="234" font-size="10" font-weight="400" fill="#FF8A3D" class="mono" text-anchor="start">add / prepare</text>
