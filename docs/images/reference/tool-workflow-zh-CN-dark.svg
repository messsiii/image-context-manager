<path d="M0 15L20 26L40 15V21L20 32L0 21Z" fill="#111113" stroke="#3D3D45"/><path d="M0 15L20 4L40 15L20 26Z" fill="#1A1A1E"/>
<path d="M11 9V19H29 M15 5V15H33 M18 16L22 12L28 15" stroke="#FE750E"/>
