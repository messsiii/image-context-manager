<text x="384" y="147" font-size="13" font-weight="600" fill="#EDEDEF" class="sans" text-anchor="start">看图并核对结果</text>
<text x="384" y="170" font-size="11" font-weight="400" fill="#A1A1AA" class="sans" text-anchor="start">agent / 可选看图子 agent</text>
<text x="384" y="194" font-size="10" font-weight="400" fill="#A1A1AA" class="sans" text-anchor="start">由当前 agent 启动</text>
<text x="384" y="210" font-size="10" font-weight="400" fill="#A1A1AA" class="sans" text-anchor="start">只回传文字</text>
<text x="384" y="234" font-size="10" font-weight="400" fill="#FF8A3D" class="mono" text-anchor="start">delegate（可选）</text>
