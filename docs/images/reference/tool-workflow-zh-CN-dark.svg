</g>
<text x="672" y="108" font-size="11" font-weight="400" fill="#FF8A3D" class="mono" text-anchor="end">04</text>
<text x="558" y="147" font-size="13" font-weight="600" fill="#EDEDEF" class="sans" text-anchor="start">保存核对后的结论</text>
<text x="558" y="170" font-size="11" font-weight="400" fill="#A1A1AA" class="sans" text-anchor="start">ICM 本地工具</text>
<text x="558" y="194" font-size="10" font-weight="400" fill="#A1A1AA" class="sans" text-anchor="start">完成且足够使用后，复用文字</text>
<text x="558" y="234" font-size="10" font-weight="400" fill="#FF8A3D" class="mono" text-anchor="start">record / prepare</text>
<rect x="24" y="310" width="672" height="68" rx="10" fill="#1A1A1E" stroke="#3D3D45" stroke-dasharray="4 3"/>
<text x="42" y="337" font-size="15" font-weight="600" fill="#EDEDEF" class="sans" text-anchor="start">原图与版本</text>
<text x="42" y="359" font-size="12" font-weight="400" fill="#A1A1AA" class="sans" text-anchor="start">文件保存在本地，原图始终可取回</text>
<path d="M240 252V308" class="wire"/>
<path d="M240 252V308" class="pulse"/>
<text x="230" y="284" font-size="11" font-weight="400" fill="#FF8A3D" class="sans" text-anchor="end">保存原图</text>
<path d="M620 308V280H294V252" class="wire"/>
<path d="M620 308V280H294V252" class="pulse"/>
<text x="460" y="274" font-size="11" font-weight="400" fill="#FF8A3D" class="sans" text-anchor="middle">取回原图，重新核对</text>
<text x="24" y="402" font-size="10" font-weight="400" fill="#A1A1AA" class="sans" text-anchor="start">流程示意 · 按任务与核验情况选择处理方式</text>
</svg>
