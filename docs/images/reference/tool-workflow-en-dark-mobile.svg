<title id="title">How ICM handles an image task</title><desc id="desc">The skill guides task decisions. Local tools preserve originals and prepare images. The agent or an optional native worker inspects them. Only checked, sufficient findings are reused as text; originals can be recalled.</desc>
<defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r=".7" fill="#232328"/></pattern>
