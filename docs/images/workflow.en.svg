<svg xmlns="http://www.w3.org/2000/svg" width="600" height="814" viewBox="0 0 600 814" role="img" aria-labelledby="title desc">
<title id="title">Draft → current → compare → continue</title>
<desc id="desc">Conceptual example, not performance data: A is a draft read task; once eligible A becomes a reference while B remains current. Comparing restores both. Continuing requires fresh state and eligibility checks.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17283b}.title{font-size:28px;font-weight:700}.label{font-size:26px;font-weight:650}.body{font-size:26px}</style>
<rect width="600" height="814" rx="16" fill="#f5f8fb"/>
<text class="title" x="28" y="48">Draft → current → compare → continue</text>
<rect x="24" y="80" width="552" height="124" rx="12" fill="#ffffff" stroke="#cbd6e1"/>
<rect x="24" y="80" width="6" height="124" rx="3" fill="#71562e"/>
<text class="label" x="44" y="116">1 · Read draft A</text>
<text class="body" x="44" y="154">Request: A pixels.</text>
<text class="body" x="44" y="186">Host checks and records the read result.</text>
<path d="M300 210 v18 m-6 -6 6 6 6 -6" fill="none" stroke="#718497" stroke-width="3"/>
<rect x="24" y="234" width="552" height="124" rx="12" fill="#ffffff" stroke="#cbd6e1"/>
<rect x="24" y="234" width="6" height="124" rx="3" fill="#285d8c"/>
<text class="label" x="44" y="270">2 · Review current B</text>
<text class="body" x="44" y="308">A read finished; all guards pass.</text>
<text class="body" x="44" y="340">Request: A reference + B pixels.</text>
<path d="M300 364 v18 m-6 -6 6 6 6 -6" fill="none" stroke="#718497" stroke-width="3"/>
<rect x="24" y="388" width="552" height="124" rx="12" fill="#ffffff" stroke="#cbd6e1"/>
<rect x="24" y="388" width="6" height="124" rx="3" fill="#71562e"/>
<text class="label" x="44" y="424">3 · Compare A and B</text>
<text class="body" x="44" y="462">Host declares comparison for BOTH.</text>
<text class="body" x="44" y="494">Rebuild request: A pixels + B pixels.</text>
<path d="M300 518 v18 m-6 -6 6 6 6 -6" fill="none" stroke="#718497" stroke-width="3"/>
<rect x="24" y="542" width="552" height="156" rx="12" fill="#ffffff" stroke="#cbd6e1"/>
<rect x="24" y="542" width="6" height="156" rx="3" fill="#285d8c"/>
<text class="label" x="44" y="578">4 · Continue after comparison</text>
<text class="body" x="44" y="616">Host closes comparison; updates tasks.</text>
<text class="body" x="44" y="648">Recheck guards: A may be a reference;</text>
<text class="body" x="44" y="680">B stays as pixels while still needed.</text>
<text class="body" x="28" y="728">Concept only; no measured savings.</text>
<text class="body" x="28" y="760">Any pending evidence keeps its pixels.</text>
</svg>
