<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">离线示例 · 请求内容示意</title>
<desc id="desc">Synthetic offline demo: all three images are replayed on the left/before. After eligible draft retirement the request has a draft reference and two protected images; originals stay stored.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#f1f5fc}.muted{fill:#a9b8cd}.label{font-weight:700}.blue{fill:#87a9ff}</style>
<rect x="0" y="0" width="900" height="420" rx="16" fill="#101720" stroke="none"/>
<text x="22" y="30" font-size="19" class="muted" text-anchor="start">离线示例 · 请求内容示意</text>
<rect x="18" y="48" width="423" height="274" rx="12" fill="#192330" stroke="#39485d"/>
<text x="38" y="82" font-size="26" class="label" text-anchor="start">全部重发</text>
<text x="38" y="109" font-size="20" class="muted" text-anchor="start">3 张图片附件</text>
<rect x="38" y="127" width="110" height="110" rx="6" fill="#253140" stroke="#39485d"/>
<circle cx="56" cy="146" r="5" fill="#a9b8cd"/>
<path d="M50 221 l24.2 -30.800000000000004 17.6 17.6 27.5 -41.8 22.0 55.0Z" fill="#a9b8cd" opacity=".38"/>
<text x="38" y="264" font-size="21" class="label" text-anchor="start">草稿</text>
<text x="38" y="291" font-size="18" class="muted" text-anchor="start">读取完成</text>
<rect x="164" y="127" width="110" height="110" rx="6" fill="#253140" stroke="#39485d"/>
<circle cx="182" cy="146" r="5" fill="#87a9ff"/>
<path d="M176 221 l24.2 -30.800000000000004 17.6 17.6 27.5 -41.8 22.0 55.0Z" fill="#87a9ff" opacity=".38"/>
<text x="164" y="264" font-size="21" class="label" text-anchor="start">候选稿</text>
<text x="164" y="291" font-size="18" class="muted" text-anchor="start">用于比较</text>
<rect x="290" y="127" width="110" height="110" rx="6" fill="#253140" stroke="#39485d"/>
<circle cx="308" cy="146" r="5" fill="#a9b8cd"/>
<path d="M302 221 l24.2 -30.800000000000004 17.6 17.6 27.5 -41.8 22.0 55.0Z" fill="#a9b8cd" opacity=".38"/>
<text x="290" y="264" font-size="21" class="label" text-anchor="start">待核验</text>
<text x="290" y="291" font-size="18" class="muted" text-anchor="start">尚未确认</text>
<rect x="459" y="48" width="423" height="274" rx="12" fill="#192330" stroke="#39485d"/>
<text x="479" y="82" font-size="26" class="label" text-anchor="start">只带本轮需要的像素</text>
<text x="479" y="109" font-size="20" class="muted" text-anchor="start">2 张图片 + 1 条引用</text>
<rect x="479" y="126" width="383" height="38" rx="7" fill="#233451" stroke="none"/>
<text x="491" y="152" font-size="20" class="blue" text-anchor="start">草稿 · 来源 + 已核验结果</text>
<rect x="479" y="178" width="110" height="64" rx="6" fill="#253140" stroke="#39485d"/>
<circle cx="497" cy="197" r="5" fill="#87a9ff"/>
<path d="M491 226 l24.2 -17.92 17.6 10.24 27.5 -24.32 22.0 32.0Z" fill="#87a9ff" opacity=".38"/>
<text x="479" y="269" font-size="21" class="label" text-anchor="start">候选稿</text>
<rect x="607" y="178" width="110" height="64" rx="6" fill="#253140" stroke="#39485d"/>
<circle cx="625" cy="197" r="5" fill="#a9b8cd"/>
<path d="M619 226 l24.2 -17.92 17.6 10.24 27.5 -24.32 22.0 32.0Z" fill="#a9b8cd" opacity=".38"/>
<text x="607" y="269" font-size="21" class="label" text-anchor="start">待核验</text>
<rect x="18" y="345" width="864" height="57" rx="10" fill="#192330" stroke="#39485d"/>
<rect x="34" y="364.0" width="30" height="31" rx="3" fill="none" stroke="#87a9ff"/>
<rect x="40" y="361.6" width="30" height="31" rx="3" fill="none" stroke="#87a9ff"/>
<rect x="46" y="359.2" width="30" height="31" rx="3" fill="none" stroke="#87a9ff"/>
<text x="90" y="372" font-size="20" class="label" text-anchor="start">原图保存在请求之外</text>
<text x="90" y="396" font-size="19" class="muted" text-anchor="start">比较或召回时恢复</text>
</svg>
