<svg xmlns="http://www.w3.org/2000/svg" width="900" height="152" viewBox="0 0 900 152" role="img" aria-labelledby="title desc">
<title id="title">Host → Image Context Manager → provider adapter</title>
<desc id="desc">The host owns canonical history and trusted task state; the component checks a request copy; the host adapter checks and sends. No automatic task recognition or provider call is implied.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#141b26}.muted{fill:#617085}.label{font-weight:700}.blue{fill:#315ee8}</style>
<rect x="10" y="10" width="278" height="98" rx="10" fill="#f5f7fb" stroke="#d4dce8"/>
<text x="28" y="49" font-size="23" class="label" text-anchor="start">你的宿主</text>
<text x="28" y="82" font-size="20" class="muted" text-anchor="start">完整历史 + 可信任务状态</text>
<path d="M292 59 h14 m-5 -5 5 5 -5 5" fill="none" stroke="#617085" stroke-width="2"/>
<rect x="311" y="10" width="278" height="98" rx="10" fill="#edf2ff" stroke="#d4dce8"/>
<text x="329" y="49" font-size="23" class="label" text-anchor="start">Image Context Manager</text>
<text x="329" y="82" font-size="20" class="muted" text-anchor="start">保留像素，或使用引用</text>
<path d="M593 59 h14 m-5 -5 5 5 -5 5" fill="none" stroke="#617085" stroke-width="2"/>
<rect x="612" y="10" width="278" height="98" rx="10" fill="#f5f7fb" stroke="#d4dce8"/>
<text x="630" y="49" font-size="23" class="label" text-anchor="start">你的模型适配器</text>
<text x="630" y="82" font-size="20" class="muted" text-anchor="start">检查并发送请求副本</text>
<text x="450" y="139" font-size="20" class="muted" text-anchor="middle">完整原始历史保持不变。</text>
</svg>
