name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  install-test-demo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -I tools/verify_install.py --tests tests --out run-data/ci-verification
      - run: icm-demo --out run-data/ci-cli-demo
      - run: python examples/offline_demo.py --out run-data/ci-python-demo
